<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.13/dist/lenis.min.js"></script>

<style>
  :root {
    --bg:        #ffffff;
    --bg-cream:  #faf7f0;
    --bg-warm:   #f5f0e4;
    --text:      #1a1a17;
    --text-soft: rgba(26,26,23,0.72);
    --text-mute: rgba(26,26,23,0.5);
    --text-faint:rgba(26,26,23,0.3);
    --line:      rgba(26,26,23,0.12);
    --line-soft: rgba(26,26,23,0.06);
    --ink:       #1a1a17;
    --trust:     #0a4d2f;
    --trust-soft: #e8f0ec;
    --gold:      #8b6914;
    --paper:     #faf7f0;
    --ease-quiet: cubic-bezier(.22, 1, .36, 1);
    --ease-precise: cubic-bezier(.4, 0, .2, 1);
    --ease-emphasis: cubic-bezier(.16, 1, .3, 1);
  }

  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
  body {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    color: var(--text);
    background: var(--bg);
    line-height: 1.5;
    overflow-x: hidden;
  }

  ::selection { background: var(--trust); color: #fff; }

  h1,h2,h3,h4 {
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    letter-spacing: -0.025em;
    line-height: 0.92;
    color: var(--ink);
  }

  .mono { font-family: 'IBM Plex Mono', monospace; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; font-size: 11px; }

  /* ============ NAV ============ */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 1.25rem 2rem;
    background: rgba(255,255,255,0.88);
    backdrop-filter: blur(20px) saturate(1.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    border-bottom: 1px solid var(--line-soft);
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav-brand { display: flex; align-items: center; gap: 0.75rem; }
  .nav-logo {
    width: 38px; height: 38px;
    background: var(--trust); color: #fff;
    display: grid; place-items: center;
    font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 18px;
    letter-spacing: -0.05em;
    border-radius: 2px;
  }
  .nav-name { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 14px; letter-spacing: -0.01em; color: var(--ink); }
  .nav-name small { display: block; font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 9px; letter-spacing: 0.12em; color: var(--text-mute); margin-top: 2px; }
  .nav-cta {
    padding: 0.7rem 1.2rem;
    background: var(--trust); color: #fff;
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    text-decoration: none;
    transition: transform 0.3s var(--ease-quiet), background 0.3s var(--ease-quiet), box-shadow 0.3s var(--ease-quiet);
    box-shadow: 0 2px 0 rgba(10,77,47,0.15);
  }
  .nav-cta:hover { transform: translateY(-2px); background: #084026; box-shadow: 0 4px 12px rgba(10,77,47,0.25); }

  /* ============ HERO TILE FLIP ============ */
  .hero {
    position: relative;
    min-height: 100vh;
    padding: 6.5rem 2rem 3rem;
    display: flex; flex-direction: column;
    background: var(--bg);
  }
  .hero-top {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 2rem;
    gap: 2rem;
  }
  .hero-top-left { max-width: 360px; }
  .hero-top-left .mono { color: var(--text-mute); display: block; margin-bottom: 0.5rem; }
  .hero-top-left p { font-size: 13px; color: var(--text-soft); line-height: 1.5; }
  .hero-top-right { text-align: right; }
  .hero-top-right .mono { color: var(--text-mute); display: block; margin-bottom: 0.5rem; }
  .hero-top-right p { font-size: 13px; color: var(--text-soft); }

  .tile-grid-wrap {
    flex: 1;
    position: relative;
    perspective: 1200px;
    min-height: 460px;
  }
  .tile-grid {
    position: absolute; inset: 0;
    overflow: hidden;
  }
  .grid-cell {
    position: absolute;
    background-color: var(--bg-warm);
    transform-origin: top center;
    overflow: hidden;
    border: 0.5px solid rgba(255,255,255,0.6);
  }
  .grid-cell.is-green { background-color: var(--trust); }
  .grid-cell.is-cream { background-color: var(--bg-cream); }
  .grid-cell.is-gold { background-color: var(--gold); }

  .grid-cell .cell-content {
    width: 100%; height: 100%;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 0.6rem;
    color: #fff;
    background-size: cover; background-position: center;
  }
  .grid-cell.is-cream .cell-content { color: var(--ink); }
  .grid-cell.is-green .cell-content,
  .grid-cell.is-gold .cell-content { color: #fff; }
  .grid-cell .cell-content .mini-mono {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
    opacity: 0.85;
  }
  .grid-cell .cell-content .mini-num {
    font-family: 'Montserrat', sans-serif;
    font-weight: 900; font-size: 22px; letter-spacing: -0.02em;
    margin-top: 2px;
  }

  .hero-headline {
    position: absolute;
    bottom: -0.5rem; left: 0; right: 0;
    z-index: 5;
    pointer-events: none;
    padding: 0 0.5rem;
  }
  .hero-headline h1 {
    font-size: clamp(3.2rem, 10vw, 9.5rem);
    color: var(--ink);
    mix-blend-mode: multiply;
    text-align: center;
    line-height: 0.85;
  }

  .hero-bottom {
    margin-top: 5rem;
    display: flex; justify-content: space-between; align-items: flex-end;
    gap: 2rem; flex-wrap: wrap;
  }
  .hero-bottom-left { max-width: 380px; }
  .hero-bottom-left h2 {
    font-size: clamp(1.5rem, 2.4vw, 2.1rem);
    margin-bottom: 0.8rem;
    color: var(--ink);
  }
  .hero-bottom-left p {
    color: var(--text-soft); font-size: 14px; line-height: 1.6;
  }
  .hero-bottom-right { display: flex; gap: 0.75rem; flex-wrap: wrap; }

  /* Telegram button — premium deep green */
  .btn-telegram {
    display: inline-flex; align-items: center; gap: 0.7rem;
    padding: 1.1rem 1.6rem;
    background: var(--trust); color: #fff;
    text-decoration: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 500;
    border: 1px solid var(--trust);
    transition: all 0.4s var(--ease-quiet);
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 0 rgba(10,77,47,0.18);
  }
  .btn-telegram::before {
    content: '';
    position: absolute; inset: 0;
    background: #fff;
    transform: translateY(100%);
    transition: transform 0.5s var(--ease-quiet);
  }
  .btn-telegram:hover::before { transform: translateY(0); }
  .btn-telegram span { position: relative; z-index: 2; transition: color 0.4s var(--ease-quiet); }
  .btn-telegram:hover span { color: var(--trust); }
  .btn-telegram svg { position: relative; z-index: 2; transition: color 0.4s var(--ease-quiet); }
  .btn-telegram:hover svg { color: var(--trust); }
  .btn-telegram:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(10,77,47,0.28); }
  .btn-telegram.btn-large { padding: 1.3rem 2rem; font-size: 13px; }

  .btn-outline {
    display: inline-flex; align-items: center; gap: 0.5rem;
    padding: 1.1rem 1.4rem;
    background: transparent; color: var(--ink);
    text-decoration: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
    border: 1px solid var(--line);
    transition: all 0.3s var(--ease-quiet);
  }
  .btn-outline:hover { border-color: var(--trust); color: var(--trust); transform: translateY(-2px); }

  /* ============ TRUST BAR ============ */
  .trust-bar {
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 1.25rem 2rem;
    display: flex; justify-content: space-between; align-items: center;
    gap: 2rem; flex-wrap: wrap;
    background: var(--bg-cream);
  }
  .trust-item { display: flex; align-items: center; gap: 0.6rem; }
  .trust-dot {
    width: 8px; height: 8px; background: var(--trust); border-radius: 50%;
    position: relative;
  }
  .trust-dot::after {
    content: ''; position: absolute; inset: -3px;
    border: 1px solid var(--trust); border-radius: 50%;
    opacity: 0.3;
  }
  .trust-item span {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-soft);
  }

  /* ============ SALARY SECTION ============ */
  .salary-section {
    padding: 8rem 2rem;
    background: var(--bg);
  }
  .salary-grid {
    max-width: 1400px; margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4rem;
    align-items: end;
  }
  .salary-label .mono { color: var(--text-mute); margin-bottom: 1rem; display: block; }
  .salary-label h2 {
    font-size: clamp(2.5rem, 5vw, 4.5rem);
    margin-bottom: 1rem;
  }
  .salary-label p {
    color: var(--text-soft); font-size: 15px; line-height: 1.6; max-width: 380px;
  }
  .salary-display {
    border-left: 1px solid var(--line);
    padding-left: 3rem;
  }
  .salary-amount {
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    font-size: clamp(3.5rem, 8vw, 6.5rem);
    letter-spacing: -0.03em;
    line-height: 0.9;
    margin-bottom: 0.5rem;
    color: var(--trust);
  }
  .salary-amount .currency {
    font-size: 0.45em; vertical-align: top;
    margin-right: 0.15em;
    color: var(--text-mute);
  }
  .salary-amount .dash {
    font-size: 0.55em; color: var(--text-mute);
    margin: 0 0.2em;
    font-weight: 500;
  }
  .salary-range-note {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--text-mute);
  }
  .salary-per {
    margin-top: 1.5rem;
    font-size: 14px; color: var(--text-soft);
  }

  /* ============ HOW IT WORKS ============ */
  .how-section {
    padding: 8rem 2rem;
    background: var(--bg-cream);
    border-top: 1px solid var(--line);
  }
  .how-head { max-width: 1400px; margin: 0 auto 5rem; }
  .how-head .mono { color: var(--text-mute); margin-bottom: 1.5rem; display: block; }
  .how-head h2 {
    font-size: clamp(2.5rem, 5vw, 4.5rem);
    max-width: 800px;
  }
  .how-steps {
    max-width: 1400px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 2rem;
  }
  .step {
    border-top: 1px solid var(--ink);
    padding-top: 1.5rem;
    position: relative;
    background: #fff;
    padding: 1.5rem 1.25rem 1.5rem 1.25rem;
    margin-top: -1.5rem;
    padding-top: 2.5rem;
  }
  .step-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.12em;
    color: var(--text-mute);
    margin-bottom: 2rem;
    display: flex; justify-content: space-between;
  }
  .step h3 {
    font-size: 1.5rem;
    margin-bottom: 0.8rem;
    line-height: 1.1;
  }
  .step p {
    font-size: 13px; color: var(--text-soft); line-height: 1.6;
  }

  /* ============ LIVE NOTIFICATIONS TICKER ============ */
  .live-section {
    padding: 6rem 0 7rem;
    background: var(--bg-warm);
    color: var(--ink);
    overflow: hidden;
    position: relative;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .live-head {
    padding: 0 2rem;
    max-width: 1400px; margin: 0 auto 3rem;
    display: flex; justify-content: space-between; align-items: flex-end;
    gap: 2rem; flex-wrap: wrap;
  }
  .live-head .mono { color: var(--text-mute); margin-bottom: 1rem; display: block; }
  .live-head h2 {
    font-size: clamp(2rem, 4vw, 3.2rem);
    color: var(--ink);
  }
  .live-status {
    display: flex; align-items: center; gap: 0.6rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--text-soft);
  }
  .live-dot {
    width: 8px; height: 8px; background: #2a9d5f; border-radius: 50%;
    animation: pulse-live 1.6s infinite;
  }
  @keyframes pulse-live {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(1.4); }
  }

  .ticker-wrap {
    position: relative;
    overflow: hidden;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    background: #fff;
  }
  .ticker {
    display: flex;
    gap: 0;
    animation: ticker-scroll 60s linear infinite;
    width: max-content;
  }
  .ticker:hover { animation-play-state: paused; }
  @keyframes ticker-scroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  .tick-item {
    flex-shrink: 0;
    padding: 1.2rem 1.8rem;
    border-right: 1px solid var(--line-soft);
    display: flex; flex-direction: column;
    min-width: 280px;
  }
  .tick-top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 0.4rem;
  }
  .tick-name {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .tick-time {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px; letter-spacing: 0.1em;
    color: var(--text-faint);
  }
  .tick-bottom {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing: 0.08em;
    color: var(--text-soft);
    text-transform: uppercase;
  }
  .tick-bottom .amount {
    color: var(--trust);
    font-weight: 500;
    margin-left: 0.4rem;
  }
  .tick-bottom.action-joined .amount { color: var(--gold); }

  /* ============ GALLERY MOSAIC ============ */
  .gallery-section {
    padding: 8rem 2rem;
    background: var(--bg);
  }
  .gallery-head {
    max-width: 1400px; margin: 0 auto 4rem;
    display: flex; justify-content: space-between; align-items: flex-end;
    gap: 2rem; flex-wrap: wrap;
  }
  .gallery-head .mono { color: var(--text-mute); margin-bottom: 1rem; display: block; }
  .gallery-head h2 {
    font-size: clamp(2.5rem, 5vw, 4rem);
    max-width: 700px;
  }
  .gallery-head p {
    color: var(--text-soft); font-size: 14px; max-width: 320px; line-height: 1.6;
  }

  .mosaic {
    max-width: 1400px; margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 180px;
    gap: 0.5rem;
    grid-auto-flow: dense;
  }
  .mosaic-tile {
    position: relative;
    overflow: hidden;
    background: var(--bg-cream);
    cursor: pointer;
  }
  .mosaic-tile img {
    width: 100%; height: 100%;
    object-fit: cover;
    filter: grayscale(100%) sepia(15%);
    transition: filter 0.7s var(--ease-emphasis), transform 0.7s var(--ease-emphasis);
  }
  .mosaic-tile:hover img {
    filter: grayscale(0%) sepia(0%);
    transform: scale(1.08);
  }
  .mosaic-tile .tile-label {
    position: absolute;
    bottom: 0.75rem; left: 0.75rem;
    background: rgba(255,255,255,0.95);
    padding: 0.35rem 0.6rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.4s var(--ease-quiet), transform 0.4s var(--ease-quiet);
  }
  .mosaic-tile:hover .tile-label { opacity: 1; transform: translateY(0); }
  .mosaic-tile.size-tall { grid-row: span 2; }
  .mosaic-tile.size-wide { grid-column: span 2; }
  .mosaic-tile.size-big { grid-row: span 2; grid-column: span 2; }

  /* ============ MID CTA BANNER ============ */
  .mid-cta {
    padding: 6rem 2rem;
    background: var(--trust-soft);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .mid-cta-wrap {
    max-width: 1100px; margin: 0 auto;
    text-align: center;
  }
  .mid-cta .mono { color: var(--trust); margin-bottom: 1.5rem; display: block; }
  .mid-cta h2 {
    font-size: clamp(2.2rem, 5vw, 4rem);
    margin-bottom: 1.5rem;
  }
  .mid-cta p {
    color: var(--text-soft); font-size: 15px; line-height: 1.6;
    max-width: 580px; margin: 0 auto 2.5rem;
  }
  .seats-counter {
    display: inline-flex; align-items: baseline; gap: 0.5rem;
    padding: 0.6rem 1.2rem;
    border: 1px solid var(--trust);
    background: #fff;
    margin-bottom: 2rem;
  }
  .seats-counter .num {
    font-family: 'Montserrat', sans-serif;
    font-weight: 900; font-size: 1.6rem;
    letter-spacing: -0.02em;
    color: var(--trust);
  }
  .seats-counter .label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-mute);
  }

  /* ============ TESTIMONIALS ============ */
  .testi-section {
    padding: 8rem 2rem;
    background: var(--bg);
  }
  .testi-head { max-width: 1400px; margin: 0 auto 5rem; }
  .testi-head .mono { color: var(--text-mute); margin-bottom: 1rem; display: block; }
  .testi-head h2 {
    font-size: clamp(2.5rem, 5vw, 4rem);
    max-width: 800px;
  }
  .testi-grid {
    max-width: 1400px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
  }
  .testi-card {
    border: 1px solid var(--line);
    padding: 2rem 1.75rem;
    transition: border-color 0.4s var(--ease-quiet), transform 0.4s var(--ease-quiet), box-shadow 0.4s var(--ease-quiet);
    background: #fff;
  }
  .testi-card:hover {
    border-color: var(--trust);
    transform: translateY(-4px);
    box-shadow: 0 12px 32px rgba(10,77,47,0.08);
  }
  .testi-card .testi-meta {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 1.5rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--line);
  }
  .testi-card .testi-name {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800; font-size: 14px;
    color: var(--ink);
  }
  .testi-card .testi-loc {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px; letter-spacing: 0.1em;
    color: var(--text-mute);
    margin-top: 2px;
  }
  .testi-card .testi-amount {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing: 0.1em;
    background: var(--trust); color: #fff;
    padding: 0.25rem 0.5rem;
  }
  .testi-card p {
    font-size: 14px; line-height: 1.6; color: var(--text-soft);
  }
  .testi-card .testi-stars {
    margin-top: 1.2rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing: 0.15em;
    color: var(--gold);
  }

  /* ============ FAQ ============ */
  .faq-section {
    padding: 8rem 2rem;
    background: var(--bg-cream);
    border-top: 1px solid var(--line);
  }
  .faq-grid {
    max-width: 1200px; margin: 0 auto;
